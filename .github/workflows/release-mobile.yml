name: Mobile Release

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/tauri.android.conf.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          VER=$(node -p "try { require('./src-tauri/tauri.android.conf.json').version || '1.0.0' } catch { '1.0.0' }")
          TAG="mobile-v$VER"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target mobile version: $VER ($TAG)"

      - name: Check Existing Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG not found."
          fi

  build-mobile:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Dependencies
        run: npm ci

      - name: Build Mobile APKs
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: npm run tauri android build

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist-mobile
          VER="${{ needs.preflight.outputs.version }}"
          
          UNIVERSAL_SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          ARM64_SRC="src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk"
          
          if [ -f "$UNIVERSAL_SRC" ]; then
            cp "$UNIVERSAL_SRC" "dist-mobile/Noctune-Mobile-v${VER}-universal.apk"
          fi
          if [ -f "$ARM64_SRC" ]; then
            cp "$ARM64_SRC" "dist-mobile/Noctune-Mobile-v${VER}-arm64.apk"
          fi
          
          ls -la dist-mobile/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apks
          path: dist-mobile/*.apk
          retention-days: 1

  release:
    needs: [preflight, build-mobile]
    if: needs.preflight.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mobile APKs
        uses: actions/download-artifact@v4
        with:
          name: mobile-apks
          path: dist-mobile

      - name: Extract Release Notes from Changelog
        run: node scripts/extract-release-notes.js "${{ needs.preflight.outputs.version }}" RELEASE_NOTES_MOBILE.md CHANGELOG-MOBILE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Noctune Mobile v${{ needs.preflight.outputs.version }}
          body_path: RELEASE_NOTES_MOBILE.md
          generate_release_notes: true
          files: dist-mobile/*.apk
