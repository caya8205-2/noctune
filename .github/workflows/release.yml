name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Check version & whether release already exists ─────────────────────────
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "v$version" --json tagName > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v$version already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v$version not found."
          fi

  # ─── Windows build (NSIS installer, signed) ──────────────────────────────────
  build-windows:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled yt-dlp (Windows)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/yt-dlp.exe
            src-tauri/resources/.yt-dlp-platform
          key: ${{ runner.os }}-yt-dlp-${{ hashFiles('scripts/prepare-ytdlp.mjs') }}

      - name: Build Tauri (Windows)
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_RPC_ENABLED: ${{ secrets.DISCORD_RPC_ENABLED }}
          DISCORD_RPC_LARGE_IMAGE_KEY: ${{ secrets.DISCORD_RPC_LARGE_IMAGE_KEY }}
          DISCORD_RPC_SMALL_IMAGE_KEY: ${{ secrets.DISCORD_RPC_SMALL_IMAGE_KEY }}
          LAST_FM_KEY: ${{ secrets.LAST_FM_KEY }}
          LAST_FM_SECRET: ${{ secrets.LAST_FM_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run tauri:build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/Noctune_${{ needs.preflight.outputs.version }}_x64-setup.exe
          retention-days: 1

  # ─── Linux build (.deb + .AppImage) ─────────────────────────────────────────
  build-linux:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled yt-dlp (Linux)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/yt-dlp.exe
            src-tauri/resources/.yt-dlp-platform
          key: ${{ runner.os }}-yt-dlp-${{ hashFiles('scripts/prepare-ytdlp.mjs') }}

      - name: Build Tauri (Linux)
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_RPC_ENABLED: ${{ secrets.DISCORD_RPC_ENABLED }}
          DISCORD_RPC_LARGE_IMAGE_KEY: ${{ secrets.DISCORD_RPC_LARGE_IMAGE_KEY }}
          DISCORD_RPC_SMALL_IMAGE_KEY: ${{ secrets.DISCORD_RPC_SMALL_IMAGE_KEY }}
          LAST_FM_KEY: ${{ secrets.LAST_FM_KEY }}
          LAST_FM_SECRET: ${{ secrets.LAST_FM_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run tauri:build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/appimage/*
          retention-days: 1

  # ─── Create GitHub Release with all artifacts ────────────────────────────────
  release:
    needs: [preflight, build-windows, build-linux]
    if: needs.preflight.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: v${{ needs.preflight.outputs.version }}-stable
          generate_release_notes: true
          files: |
            dist/windows/*
            dist/linux/**/*.deb
            dist/linux/**/*.AppImage

